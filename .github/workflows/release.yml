name: Release

# main    -> stable releases, consumed by every customer site
# develop -> beta pre-releases, consumed only by sites on the beta channel
on:
  push:
    branches: [main, develop]
  # Re-publish an existing tag. Needed when a release was tagged but its
  # package or manifest did not get published, so that recovery does not
  # require deleting and recreating the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.2.0-beta"
        required: true
        type: string

# Deliberately no pull-requests permission. This workflow only tags and
# publishes a release that a human already reviewed and merged; opening the
# release pull request is a developer step, not an unattended one.
permissions:
  contents: write
  # Lets release-please comment on and relabel the release pull request it just
  # released. This does NOT allow opening pull requests — that needs
  # pull-requests: write, which is deliberately withheld.
  issues: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Tag the merged release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: ${{ github.ref_name }}
          # Tag and publish only. Opening the release pull request is done by a
          # developer with bin/release-pr.sh, so GitHub Actions never needs
          # permission to create pull requests.
          skip-github-pull-request: true
          # develop carries its own config so that the prerelease settings do
          # not travel to main when develop is merged.
          config-file: ${{ github.ref_name == 'develop' && '.github/release-please-config.develop.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'develop' && '.github/.release-please-manifest.develop.json' || '.release-please-manifest.json' }}

  publish:
    name: Build and publish
    needs: release-please
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag, version and channel
        id: rel
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || needs.release-please.outputs.tag }}"
          test -n "$TAG"
          VERSION="${TAG#v}"
          # A prerelease version carries a hyphenated suffix; that, not the
          # branch, is what decides which channel the manifest belongs to.
          case "$VERSION" in
            *-*) CHANNEL=beta ;;
            *)   CHANNEL=stable ;;
          esac
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "publishing $TAG as $VERSION on the $CHANNEL channel"

      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}

      - name: Verify the plugin header matches the tag
        run: |
          set -euo pipefail
          HEADER="$(grep -m1 -E '^ \* Version:' mmp-coming-soon.php | awk '{print $3}')"
          CONST="$(grep -m1 -E "define\( 'MMPCS_VERSION'" mmp-coming-soon.php | sed -E "s/.*'([^']+)'.*/\1/")"
          WANT="${{ steps.rel.outputs.version }}"
          echo "header=$HEADER const=$CONST want=$WANT"
          test "$HEADER" = "$WANT"
          test "$CONST" = "$WANT"

      - name: Lint PHP
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build the plugin zip
        run: bin/build-zip.sh "${{ github.workspace }}/mmp-coming-soon.zip"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The asset filename is load-bearing: the manifest's download_url is a
          # template ending in mmp-coming-soon.zip, so any other name publishes
          # a release whose package 404s for every installed site.
          test -f mmp-coming-soon.zip
          gh release upload "${{ steps.rel.outputs.tag }}" mmp-coming-soon.zip --clobber

      - name: The published package URL must resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.rel.outputs.tag }}/mmp-coming-soon.zip"
          echo "checking $URL"
          # Release assets take a few seconds to become downloadable.
          for attempt in 1 2 3 4 5 6; do
            CODE="$(curl -sSL -o /tmp/pkg.zip -w '%{http_code}' "$URL" || true)"
            if [ "$CODE" = "200" ] && unzip -tq /tmp/pkg.zip >/dev/null 2>&1; then
              ROOTS="$(unzip -Z1 /tmp/pkg.zip | cut -d/ -f1 | sort -u)"
              test "$ROOTS" = "mmp-coming-soon"
              echo "package downloadable and correctly structured"
              exit 0
            fi
            echo "attempt $attempt: HTTP $CODE, retrying"
            sleep 10
          done
          echo "::error::the release package is not downloadable at $URL"
          exit 1

      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CHANNEL="${{ steps.rel.outputs.channel }}"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The manifests branch is orphaned on purpose: nothing merges into it,
          # so a develop-to-main merge can never advertise a beta build to
          # stable sites.
          git clone --depth 1 --branch manifests \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" manifests-branch \
            || {
              git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" manifests-branch
              cd manifests-branch
              git checkout --orphan manifests
              git rm -rf . >/dev/null 2>&1 || true
              cd ..
            }

          python3 bin/manifest.py "$CHANNEL" \
            "${{ steps.rel.outputs.version }}" \
            "${{ github.repository }}" \
            "manifests-branch/${CHANNEL}.json"

          cd manifests-branch
          git add "${CHANNEL}.json"
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "chore: publish ${CHANNEL} manifest ${{ steps.rel.outputs.version }}"
          git push origin manifests
